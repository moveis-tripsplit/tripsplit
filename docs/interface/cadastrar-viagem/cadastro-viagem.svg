<svg width="390" height="1180" viewBox="0 0 390 1180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definições de Estilos, Fontes e Efeitos -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
    <filter id="card-shadow" x="12" y="0" width="366" height="100%" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
    <filter id="btn-shadow" x="0" y="0" width="100%" height="100%" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Fundo da Tela (Token: Background #F8FAFC) -->
  <rect id="Screen-Background" width="390" height="1180" rx="36" fill="#F8FAFC" />

  <!-- ======================================================= -->
  <!-- 1. STATUS BAR (iOS / Padrão Mobile)                      -->
  <!-- ======================================================= -->
  <g id="Status-Bar">
    <!-- Horário -->
    <text x="32" y="32" font-size="14" font-weight="600" fill="#172033" letter-spacing="-0.2">09:41</text>
    <!-- Dynamic Island / Sensor Notch Central -->
    <rect x="142" y="14" width="106" height="26" rx="13" fill="#000000" />
    <!-- Ícones de Sistema (Sinal, Wi-Fi, Bateria) -->
    <!-- Sinal Celular -->
    <rect x="296" y="24" width="3" height="4" rx="0.8" fill="#172033" />
    <rect x="301" y="22" width="3" height="6" rx="0.8" fill="#172033" />
    <rect x="306" y="20" width="3" height="8" rx="0.8" fill="#172033" />
    <rect x="311" y="18" width="3" height="10" rx="0.8" fill="#172033" />
    <!-- Wi-Fi -->
    <path d="M322 20C324.2 18.2 327.8 18.2 330 20M323.5 22.5C325 21.2 327 21.2 328.5 22.5M325.5 25C325.8 24.6 326.2 24.6 326.5 25" stroke="#172033" stroke-width="1.6" stroke-linecap="round" fill="none" />
    <!-- Bateria -->
    <rect x="336" y="19" width="22" height="11" rx="3" stroke="#172033" stroke-width="1.4" fill="none" />
    <rect x="338" y="21" width="14" height="7" rx="1.5" fill="#16A34A" />
    <path d="M359 23V26" stroke="#172033" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- ======================================================= -->
  <!-- 2. TOP APP BAR (Navegação & Título)                    -->
  <!-- ======================================================= -->
  <g id="Top-AppBar">
    <!-- Botão Voltar (Círculo 40x40 com seta) -->
    <g id="Btn-Back" cursor="pointer">
      <rect x="20" y="52" width="40" height="40" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <path d="M43 72H35M35 72L39 68M35 72L39 76" stroke="#172033" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <!-- Título Principal da Barra -->
    <text x="195" y="77" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">Cadastrar Viagem</text>
    <!-- Botão Fechar / Cancelar à direita -->
    <g id="Btn-Cancel" cursor="pointer">
      <rect x="330" y="52" width="40" height="40" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <path d="M345 67L355 77M355 67L345 77" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" />
    </g>
  </g>

  <!-- ======================================================= -->
  <!-- 3. HEADER INTRODUTÓRIO & INDICADOR                      -->
  <!-- ======================================================= -->
  <g id="Header-Intro">
    <!-- Badge Categoria Azul Oceano (Primary #2563EB) -->
    <rect x="20" y="106" width="168" height="26" rx="13" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1" />
    <!-- Mini Aviãozinho SVG -->
    <path d="M32 119L41 115L39 123L37 121L34 122L35 120L32 119Z" fill="#2563EB" />
    <text x="47" y="123" font-size="11" font-weight="600" fill="#2563EB">NOVA VIAGEM EM GRUPO</text>

    <!-- Título H1 (Token: H1 28sp Bold #172033) -->
    <text x="20" y="156" font-size="24" font-weight="700" fill="#172033">Para onde vamos?</text>
    <!-- Subtítulo (Token: BodySmall 14sp #64748B) -->
    <text x="20" y="177" font-size="13" font-weight="400" fill="#64748B">Preencha os dados da viagem para começar a dividir</text>
    <text x="20" y="193" font-size="13" font-weight="400" fill="#64748B">despesas e organizar os participantes facilmente.</text>
  </g>

  <!-- ======================================================= -->
  <!-- 4. CARD 1: DADOS PRINCIPAIS (Título & Descrição)        -->
  <!-- ======================================================= -->
  <g id="Card-Trip-Details">
    <!-- Container Card (Token: Surface #FFFFFF, RadiusLG 16dp, Border #E2E8F0) -->
    <rect x="20" y="212" width="350" height="204" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />

    <!-- Campo: Título da Viagem -->
    <g id="Field-Title">
      <text x="36" y="238" font-size="13" font-weight="600" fill="#172033">
        Título da viagem <tspan fill="#DC2626">*</tspan>
      </text>
      <!-- Input Box (Token: RadiusMD 12dp, Border #2563EB Focus / #E2E8F0) -->
      <rect x="36" y="248" width="318" height="48" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8" />
      <!-- Ícone Viagem / Localização (Accent #F97316) -->
      <circle cx="56" cy="272" r="10" fill="#FFF7ED" />
      <path d="M56 266C53.8 266 52 267.8 52 270C52 273 56 277 56 277C56 277 60 273 60 270C60 267.8 58.2 266 56 266ZM56 271.5C55.2 271.5 54.5 270.8 54.5 270C54.5 269.2 55.2 268.5 56 268.5C56.8 268.5 57.5 269.2 57.5 270C57.5 270.8 56.8 271.5 56 271.5Z" fill="#F97316" />
      <!-- Texto Preenchido -->
      <text x="76" y="277" font-size="14" font-weight="500" fill="#172033">Férias em Florianópolis 🏖️</text>
    </g>

    <!-- Campo: Descrição -->
    <g id="Field-Description">
      <text x="36" y="322" font-size="13" font-weight="600" fill="#172033">
        Descrição <tspan font-weight="400" fill="#64748B">(opcional)</tspan>
      </text>
      <!-- Textarea Box (Token: RadiusMD 12dp, Border #E2E8F0) -->
      <rect x="36" y="332" width="318" height="66" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <!-- Texto Multilinha de Descrição -->
      <text x="48" y="354" font-size="12" font-weight="400" fill="#64748B">Viagem com a galera da faculdade para curtir as praias</text>
      <text x="48" y="372" font-size="12" font-weight="400" fill="#64748B">do norte da ilha, passeios e churrasco na casa.</text>
      <!-- Contador de Caracteres -->
      <text x="342" y="392" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="end">104/250</text>
    </g>
  </g>

  <!-- ======================================================= -->
  <!-- 5. CARD 2: DATA & PERÍODO                               -->
  <!-- ======================================================= -->
  <g id="Card-Dates">
    <!-- Container Card (Token: Surface #FFFFFF, RadiusLG 16dp) -->
    <rect x="20" y="428" width="350" height="122" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />

    <!-- Título do Bloco de Data -->
    <text x="36" y="452" font-size="13" font-weight="600" fill="#172033">
      Período da viagem <tspan fill="#DC2626">*</tspan>
    </text>

    <!-- Caixa Data Início -->
    <g id="Box-Date-Start">
      <rect x="36" y="462" width="138" height="50" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <!-- Ícone Calendário -->
      <path d="M48 480H58M48 484H55M46 476C46 474.9 46.9 474 48 474H58C59.1 474 60 474.9 60 476V488C60 489.1 59.1 490 58 490H48C46.9 490 46 489.1 46 488V476ZM49 472V474M57 472V474" stroke="#2563EB" stroke-width="1.4" stroke-linecap="round" fill="none" />
      <text x="66" y="478" font-size="10" font-weight="500" fill="#64748B">Ida</text>
      <text x="66" y="497" font-size="13" font-weight="600" fill="#172033">15/11/2026</text>
    </g>

    <!-- Seta Conectora -->
    <path d="M182 487L194 487M191 483L195 487L191 491" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Caixa Data Término -->
    <g id="Box-Date-End">
      <rect x="204" y="462" width="150" height="50" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <!-- Ícone Calendário -->
      <path d="M216 480H226M216 484H223M214 476C214 474.9 214.9 474 216 474H226C227.1 474 228 474.9 228 476V488C228 489.1 227.1 490 226 490H216C214.9 490 214 489.1 214 488V476ZM217 472V474M225 472V474" stroke="#2563EB" stroke-width="1.4" stroke-linecap="round" fill="none" />
      <text x="234" y="478" font-size="10" font-weight="500" fill="#64748B">Volta</text>
      <text x="234" y="497" font-size="13" font-weight="600" fill="#172033">22/11/2026</text>
    </g>

    <!-- Chip Informativo Duração (Token: Success #16A34A / #DCFCE7) -->
    <rect x="36" y="520" width="128" height="20" rx="10" fill="#DCFCE7" />
    <text x="44" y="534" font-size="10" font-weight="600" fill="#16A34A">✓ 7 dias de viagem</text>
    <!-- Texto auxiliar flexível -->
    <text x="174" y="534" font-size="11" font-weight="400" fill="#64748B">Você pode alterar depois</text>
  </g>

  <!-- ======================================================= -->
  <!-- 6. CARD 3: ROTEIRO (Com aviso: pode adicionar depois)   -->
  <!-- ======================================================= -->
  <g id="Card-Itinerary">
    <!-- Container Card (Token: Surface #FFFFFF, RadiusLG 16dp) -->
    <rect x="20" y="562" width="350" height="236" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />

    <!-- Cabeçalho da Seção Roteiro -->
    <text x="36" y="588" font-size="14" font-weight="700" fill="#172033">Roteiro de Atividades</text>

    <!-- Pill de Status: Pode adicionar depois (Accent #F97316) -->
    <rect x="214" y="574" width="140" height="22" rx="11" fill="#FFF7ED" stroke="#FFEDD5" stroke-width="1" />
    <circle cx="224" cy="585" r="3" fill="#F97316" />
    <text x="231" y="589" font-size="10" font-weight="600" fill="#F97316">Pode adicionar depois</text>

    <!-- Subtítulo explicativo -->
    <text x="36" y="608" font-size="12" font-weight="400" fill="#64748B">Atividades já programadas para esta viagem:</text>

    <!-- Item de Roteiro 1 -->
    <g id="Itinerary-Item-1">
      <rect x="36" y="620" width="318" height="42" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <!-- Marcador Azul -->
      <rect x="36" y="620" width="4" height="42" rx="2" fill="#2563EB" />
      <text x="48" y="637" font-size="10" font-weight="600" fill="#2563EB">DIA 1 • 15/11 — 14:00</text>
      <text x="48" y="652" font-size="12" font-weight="600" fill="#172033">Check-in na Casa de Canasvieiras</text>
      <!-- Tag Local -->
      <text x="342" y="645" font-size="11" font-weight="400" fill="#64748B" text-anchor="end">📍 Praia Norte</text>
    </g>

    <!-- Item de Roteiro 2 -->
    <g id="Itinerary-Item-2">
      <rect x="36" y="670" width="318" height="42" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <!-- Marcador Laranja -->
      <rect x="36" y="670" width="4" height="42" rx="2" fill="#F97316" />
      <text x="48" y="687" font-size="10" font-weight="600" fill="#F97316">DIA 2 • 16/11 — 10:00</text>
      <text x="48" y="702" font-size="12" font-weight="600" fill="#172033">Passeio de Barco - Ilha do Campeche</text>
      <!-- Tag Custo estimado -->
      <text x="342" y="695" font-size="11" font-weight="600" fill="#16A34A" text-anchor="end">💰 R$ 120/pessoa</text>
    </g>

    <!-- Botão de Ação: Adicionar Atividade -->
    <g id="Btn-Add-Activity" cursor="pointer">
      <rect x="36" y="722" width="318" height="40" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4 3" />
      <path d="M136 742H146M141 737V747" stroke="#2563EB" stroke-width="2" stroke-linecap="round" />
      <text x="154" y="746" font-size="12" font-weight="600" fill="#2563EB">Adicionar atividade ao roteiro</text>
    </g>

    <!-- Alerta Informativo Sutil (Token Design System: Feedback Info) -->
    <text x="36" y="784" font-size="11" font-weight="400" fill="#64748B">
      💡 <tspan font-weight="500" fill="#172033">Dica:</tspan> Não planejou tudo ainda? Crie novas atividades a qualquer momento.
    </text>
  </g>

  <!-- ======================================================= -->
  <!-- 7. CARD 4: PARTICIPANTES (Com aviso: adicionar depois)  -->
  <!-- ======================================================= -->
  <g id="Card-Participants">
    <!-- Container Card (Token: Surface #FFFFFF, RadiusLG 16dp) -->
    <rect x="20" y="810" width="350" height="236" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />

    <!-- Cabeçalho da Seção Participantes -->
    <text x="36" y="836" font-size="14" font-weight="700" fill="#172033">Participantes da Viagem (4)</text>

    <!-- Pill de Status: Pode adicionar depois (Success #16A34A) -->
    <rect x="214" y="822" width="140" height="22" rx="11" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="1" />
    <circle cx="224" cy="833" r="3" fill="#16A34A" />
    <text x="231" y="837" font-size="10" font-weight="600" fill="#16A34A">Pode adicionar depois</text>

    <!-- Subtítulo explicativo -->
    <text x="36" y="856" font-size="12" font-weight="400" fill="#64748B">Quem vai dividir os gastos e curtir essa viagem:</text>

    <!-- Grade / Lista de Avatares dos Participantes -->
    <g id="List-Participants">
      <!-- Participante 1: Você (Organizador) -->
      <g id="Participant-You">
        <rect x="36" y="868" width="152" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="56" cy="891" r="14" fill="#2563EB" />
        <text x="56" y="895" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">VC</text>
        <text x="76" y="886" font-size="12" font-weight="600" fill="#172033">Você</text>
        <rect x="76" y="891" width="62" height="15" rx="4" fill="#DBEAFE" />
        <text x="80" y="902" font-size="9" font-weight="600" fill="#2563EB">Organizador</text>
      </g>

      <!-- Participante 2: Beatriz -->
      <g id="Participant-Beatriz">
        <rect x="202" y="868" width="152" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="222" cy="891" r="14" fill="#16A34A" />
        <text x="222" y="895" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">BC</text>
        <text x="242" y="886" font-size="12" font-weight="600" fill="#172033">Beatriz C.</text>
        <text x="242" y="901" font-size="10" font-weight="400" fill="#16A34A">✓ Confirmada</text>
      </g>

      <!-- Participante 3: Clara -->
      <g id="Participant-Clara">
        <rect x="36" y="922" width="152" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="56" cy="945" r="14" fill="#F97316" />
        <text x="56" y="949" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">CM</text>
        <text x="76" y="940" font-size="12" font-weight="600" fill="#172033">Clara M.</text>
        <text x="76" y="955" font-size="10" font-weight="400" fill="#64748B">@clara • Ativa</text>
      </g>

      <!-- Participante 4: Fernando (Sem conta / Convidado) -->
      <g id="Participant-Fernando">
        <rect x="202" y="922" width="152" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="222" cy="945" r="14" fill="#8B5CF6" />
        <text x="222" y="949" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">FS</text>
        <text x="242" y="940" font-size="12" font-weight="600" fill="#172033">Fernando S.</text>
        <text x="242" y="955" font-size="10" font-weight="400" fill="#F97316">Sem conta (link)</text>
      </g>
    </g>

    <!-- Botão de Ação: Adicionar Participante -->
    <g id="Btn-Add-Participant" cursor="pointer">
      <rect x="36" y="976" width="318" height="40" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4 3" />
      <path d="M124 996H134M129 991V1001M138 996C138 993.8 141 992 143 992C145 992 148 993.8 148 996M143 990C144.1 990 145 989.1 145 988C145 986.9 144.1 986 143 986C141.9 986 141 986.9 141 988C141 989.1 141.9 990 143 990Z" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <text x="156" y="1000" font-size="12" font-weight="600" fill="#2563EB">Convidar ou adicionar participante</text>
    </g>

    <!-- Alerta Informativo Sutil (Regra oficial TripSplit: participantes sem conta) -->
    <text x="36" y="1034" font-size="11" font-weight="400" fill="#64748B">
      ℹ️ <tspan font-weight="500" fill="#172033">Info:</tspan> Amigos sem o app instalado também podem ser adicionados agora.
    </text>
  </g>

  <!-- ======================================================= -->
  <!-- 8. BOTTOM ACTIONS (Botão Criar Viagem & Rascunho)        -->
  <!-- ======================================================= -->
  <g id="Bottom-Actions">
    <!-- Barra Branca de Fundo com Borda Superior e Sombra Suave -->
    <rect x="0" y="1066" width="390" height="114" fill="#FFFFFF" />
    <line x1="0" y1="1066" x2="390" y2="1066" stroke="#E2E8F0" stroke-width="1" />

    <!-- Botão Primário (Token Design System: Primary Button #2563EB, RadiusMD 12dp) -->
    <g id="Btn-Submit-Trip" cursor="pointer">
      <rect x="20" y="1078" width="350" height="52" rx="12" fill="#2563EB" />
      <!-- Ícone Avião Branco -->
      <path d="M142 1104L152 1099L150 1109L148 1107L144 1108L145 1105L142 1104Z" fill="#FFFFFF" />
      <text x="195" y="1110" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Criar Viagem</text>
    </g>

    <!-- Link Secundário: Salvar como Rascunho -->
    <g id="Btn-Draft" cursor="pointer">
      <text x="195" y="1148" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Salvar como rascunho</text>
    </g>

    <!-- Home Indicator (iOS Bar) -->
    <rect x="128" y="1166" width="134" height="5" rx="2.5" fill="#172033" />
  </g>
</svg>
